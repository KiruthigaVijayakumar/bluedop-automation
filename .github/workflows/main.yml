name: QA Automation CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

    # 1. Checkout code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup Java
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Install Maven dependencies
    - name: Install Dependencies
      run: mvn clean install -DskipTests

    # 4. Install Playwright Browsers
    - name: Install Playwright Browsers
      run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install"

    # 5. Run UI Tests (TestNG)
    - name: Run UI Tests
      run: mvn test

    # 6. Install Node (needed for Newman)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # 7. Run API Tests (Postman)
    - name: Run API Tests
      run: |
        npm install -g newman
        newman run orangehrm-api.json

    # 8. Upload Reports (optional but important)
    - name: Upload Reports
      uses: actions/upload-artifact@v4
      with:
        name: Test-Reports
        path: |
          test-output/
          reports/